name: ci

# push and pull_request both. A same-repository pull request therefore produces
# two runs of each job; both have to pass, so the duplication costs runner time
# and nothing else.
on: [push, pull_request]

permissions:
  contents: read

# Both jobs go through ai/Makefile rather than carrying their own commands, so
# `make -C ai lint test` by hand runs exactly what the gate runs. The two are
# separate jobs so a lint failure and a test failure are distinguishable at a
# glance instead of one masking the other.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ShellCheck is preinstalled on the runner image (0.9.0 on ubuntu-24.04,
      # the same version this was developed against). lint.sh prints the version
      # it used, so a future image bump is diagnosable from the log.
      - name: make -C ai lint
        run: make -C ai lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: make -C ai test
        run: make -C ai test
